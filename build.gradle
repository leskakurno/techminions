plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '3.0.0'
group = 'com.techminions'

base {
    archivesName = 'techminions'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.92'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
    }
}

dependencies {
    // JEI: только для компиляции плагина (в jar мода не входит) и для запуска в среде разработки.
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.21.2.313"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.21.2.313"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.21.2.313"
}
